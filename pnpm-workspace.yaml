packages:
  - "apps/web"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Security floors for transitive dependencies flagged by `pnpm audit --audit-level high`
# (the dependency-scan job in .github/workflows/security.yml). Each stays within the major
# version its parents request. Remove an entry once the parent package ships the fix itself.
overrides:
  "body-parser@2": "^2.4.0"
  "brace-expansion@1": "^1.1.20"
  "brace-expansion@5": "^5.0.11"
  "browserslist@4": "^4.28.7"
  "fast-uri@3": "^3.1.7"
  "ip-address@10": "^10.3.1"
  "js-yaml@4": "^4.3.2"
  "nanoid@3": "^3.3.18"
  "proxy-addr@2": "^2.0.8"
  "source-map-js@1": "^1.2.2"
  "tar@7": "^7.5.21"
  "undici@6": "^6.29.1"
  "undici@7": "^7.30.1"
