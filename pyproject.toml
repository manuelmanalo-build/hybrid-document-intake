[project]
name = "hybrid-document-intake"
version = "0.1.0"
description = "Deterministic intake boundary for the hybrid agentic document workflow demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.0",
  "greenlet==3.5.3",
  "httpx==0.28.1",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.0",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "puremagic==2.2.0",
  "python-multipart==0.0.31",
  "sqlalchemy==2.0.51",
  "streamlit==1.59.1",
  "structlog==26.1.0",
  "uvicorn[standard]==0.51.0",
  "langchain-openai==1.3.5",
  "langchain-google-genai==4.2.7",
  "langchain==1.3.13",
  "pypdf==6.14.2",
  "langchain-anthropic==1.4.8",
]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.15.20",
  "testcontainers[postgres]==4.13.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/api/src", "services/orchestrator/src", "services/integration-worker/src", "services/mock-zapier/src", "apps/dashboard", "evaluation"]
exclude = [".venv", "node_modules", "dist", ".angular", "services/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "ASYNC", "C4", "DTZ", "G", "LOG", "PIE", "PT", "RET", "RSE", "S", "SIM", "T20", "TRY"]
ignore = ["S101", "TRY003", "TRY301", "N818"]

[tool.ruff.lint.per-file-ignores]
"services/api/tests/**/*.py" = ["S106"]
"services/integration-worker/tests/**/*.py" = ["S106"]
"services/mock-zapier/tests/**/*.py" = ["S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["services/api/src", "services/orchestrator/src", "services/integration-worker/src", "services/mock-zapier/src", "apps/dashboard", "evaluation"]
extraPaths = ["services/api/src", "services/orchestrator/src", "services/integration-worker/src", "services/mock-zapier/src", "evaluation"]
exclude = ["**/__pycache__", ".venv", "services/api/alembic/versions"]
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["services/api/tests", "services/orchestrator/tests", "services/integration-worker/tests", "services/mock-zapier/tests", "apps/dashboard/tests", "evaluation/tests"]
pythonpath = [".", "services/api/src", "services/orchestrator/src", "services/integration-worker/src", "services/mock-zapier/src", "apps/dashboard"]
markers = [
  "integration: requires a disposable PostgreSQL database and applies Alembic migrations",
  "graph: deterministic parent or bounded agent graph tests",
  "checkpoint: persistent checkpoint and restart tests",
  "e2e: complete first-slice end-to-end proof",
]
